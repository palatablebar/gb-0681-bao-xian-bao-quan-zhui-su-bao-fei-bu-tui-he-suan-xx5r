<section class="panel evidence"><header><h2>隔离证据</h2><span>{{data.quarantine|length}} 笔</span></header><div class="scroll"><table><thead><tr><th>行</th><th>ID</th><th>原因</th></tr></thead><tbody>{% for q in data.quarantine %}<tr><td class="num">{{q.line}}</td><td>{{q.id}}</td><td class="bad" title="{{q.raw}}">{{q.code}}</td></tr>{% else %}<tr><td colspan="3">无隔离记录</td></tr>{% endfor %}</tbody></table></div></section>
